<script>
// ===== ЭХО core: MFSK over sound, RS(255) FEC =====
const F0=1000, CH_F1=1000, CH_F2=7000, CH_LEN=0.1, GAP=0.03, LEAD=0.15, TAIL=0.15;
const MODES=[
 {id:0,name:'Надёжный',G:8, sp:100,W:0.040,off:0.016,Ts:0.060},
 {id:1,name:'Быстрый', G:16,sp:50, W:0.020,off:0.008,Ts:0.030},
 {id:2,name:'Турбо',   G:24,sp:50, W:0.020,off:0.004,Ts:0.025},
];
const HDR_SYMS=4;
function toneFreq(m,g,par,t){return F0+m.sp*(g*8+t*2+par);}
// ---- GF(256) / Reed-Solomon ----
const GE=new Uint8Array(512),GL=new Uint8Array(256);
(()=>{let x=1;for(let i=0;i<255;i++){GE[i]=x;GL[x]=i;x<<=1;if(x&256)x^=0x11d;}for(let i=255;i<512;i++)GE[i]=GE[i-255];})();
const gmul=(a,b)=>(a&&b)?GE[GL[a]+GL[b]]:0;
const gdiv=(a,b)=>a?GE[(GL[a]+255-GL[b])%255]:0;
const ginv=a=>GE[255-GL[a]];
function pmul(p,q){const r=new Array(p.length+q.length-1).fill(0);for(let j=0;j<q.length;j++)for(let i=0;i<p.length;i++)r[i+j]^=gmul(p[i],q[j]);return r;}
function padd(p,q){const n=Math.max(p.length,q.length),r=new Array(n).fill(0);for(let i=0;i<p.length;i++)r[i+n-p.length]=p[i];for(let i=0;i<q.length;i++)r[i+n-q.length]^=q[i];return r;}
const pscale=(p,x)=>p.map(c=>gmul(c,x));
function peval(p,x){let y=p[0];for(let i=1;i<p.length;i++)y=gmul(y,x)^p[i];return y;}
const GENC={};
function genpoly(n){if(GENC[n])return GENC[n];let g=[1];for(let i=0;i<n;i++)g=pmul(g,[1,GE[i]]);return GENC[n]=g;}
function rsEncode(msg,nsym){const g=genpoly(nsym),out=new Array(msg.length+nsym).fill(0);for(let i=0;i<msg.length;i++)out[i]=msg[i];
 for(let i=0;i<msg.length;i++){const c=out[i];if(c)for(let j=1;j<g.length;j++)out[i+j]^=gmul(g[j],c);}
 for(let i=0;i<msg.length;i++)out[i]=msg[i];return out;}
function rsDecode(inp,nsym){const msg=Array.from(inp),n=msg.length;const synd=[0];let any=false;
 for(let i=0;i<nsym;i++){const v=peval(msg,GE[i]);synd.push(v);if(v)any=true;}
 if(!any)return{data:msg.slice(0,n-nsym),errs:0};
 let el=[1],ol=[1];
 for(let i=0;i<nsym;i++){const K=i+1;let d=synd[K];for(let j=1;j<el.length;j++)d^=gmul(el[el.length-1-j],synd[K-j]);
  ol=ol.concat([0]);if(d){if(ol.length>el.length){const nl=pscale(ol,d);ol=pscale(el,ginv(d));el=nl;}el=padd(el,pscale(ol,d));}}
 while(el.length&&el[0]===0)el.shift();const errs=el.length-1;if(errs*2>nsym)return null;
 const rev=el.slice().reverse(),pos=[];for(let i=0;i<n;i++)if(peval(rev,GE[i])===0)pos.push(n-1-i);
 if(pos.length!==errs)return null;
 const cp=pos.map(p=>n-1-p);let eloc=[1];for(const c of cp)eloc=pmul(eloc,padd([1],[GE[c],0]));
 const prod=pmul(synd.slice().reverse(),eloc),rem=prod.slice(prod.length-eloc.length);
 const X=cp.map(c=>GE[c]);
 for(let i=0;i<X.length;i++){const xi=ginv(X[i]);let pr=1;for(let j=0;j<X.length;j++)if(j!==i)pr=gmul(pr,1^gmul(xi,X[j]));
  if(!pr)return null;let y=gmul(X[i],peval(rem,xi));msg[pos[i]]^=gdiv(y,pr);}
 for(let i=0;i<nsym;i++)if(peval(msg,GE[i]))return null;
 return{data:msg.slice(0,n-nsym),errs};}
function crc16(b){let c=0xFFFF;for(const x of b){c^=x<<8;for(let i=0;i<8;i++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF;}return c;}
// ---- framing ----
const parityLen=k=>Math.max(8,2*Math.ceil(k*0.15));
function blockSizes(len){const nb=Math.ceil(len/180),b=Math.floor(len/nb),r=len%nb;return Array.from({length:nb},(_,i)=>b+(i<r?1:0));}
function codedLen(len){return blockSizes(len).reduce((s,k)=>s+k+parityLen(k),0);}
function makeFrame(textBytes,enc,modeId){const c=crc16(textBytes);const data=[...textBytes,c>>8,c&255],len=data.length;
 const hdr=rsEncode([modeId,enc,len>>8,len&255],4);const cws=[];let o=0;
 for(const k of blockSizes(len)){cws.push(rsEncode(data.slice(o,o+k),parityLen(k)));o+=k;}
 const out=[],mx=Math.max(...cws.map(c=>c.length));for(let i=0;i<mx;i++)for(const c of cws)if(i<c.length)out.push(c[i]);
 return{hdr,payload:out};}
function parseHeader(b){const r=rsDecode(b,4);if(!r)return null;const[m,enc,h,l]=r.data,len=(h<<8)|l;
 if(m>2||enc>3||len<2)return null;return{mode:m,enc,len,errs:r.errs};}
function decodePayload(bytes,len){const sz=blockSizes(len),cl=sz.map(k=>k+parityLen(k)),cws=cl.map(n=>[]);let p=0;const mx=Math.max(...cl);
 for(let i=0;i<mx;i++)for(let b=0;b<cws.length;b++)if(i<cl[b])cws[b].push(bytes[p++]);
 const data=[];let errs=0;for(let b=0;b<cws.length;b++){const r=rsDecode(cws[b],parityLen(sz[b]));if(!r)return null;errs+=r.errs;data.push(...r.data);}
 const t=data.slice(0,len-2),c=crc16(t);if(c!==((data[len-2]<<8)|data[len-1]))return null;return{bytes:t,errs};}
// ---- text codec ----
const CYR='АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдежзийклмнопрстуфхцчшщъыьэюя',EXT='Ёё«»—–…№°₽“”„’';
function encText1(s){const o=[];for(const ch of s){const c=ch.codePointAt(0);if(c<128){o.push(c);continue;}
 let i=CYR.indexOf(ch);if(i>=0){o.push(128+i);continue;}i=EXT.indexOf(ch);if(i>=0){o.push(192+i);continue;}return null;}return o;}
function decText1(b){let s='';for(const c of b)s+=c<128?String.fromCharCode(c):c<192?CYR[c-128]:(EXT[c-192]||'?');return s;}
async function deflate(u8,dir){const cs=dir?new CompressionStream('deflate-raw'):new DecompressionStream('deflate-raw');
 const ab=await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer();return Array.from(new Uint8Array(ab));}
async function encodeText(s){let b=encText1(s),enc=0;if(!b){b=Array.from(new TextEncoder().encode(s));enc=1;}
 if(b.length>40&&typeof CompressionStream!=='undefined'){try{const z=await deflate(new Uint8Array(b),1);if(z.length<b.length){b=z;enc|=2;}}catch(e){}}
 return{bytes:b,enc};}
async function decodeText(b,enc){if(enc&2)b=await deflate(new Uint8Array(b),0);return(enc&1)?new TextDecoder().decode(new Uint8Array(b)):decText1(b);}
// ---- modulation ----
function bytesToSyms(bytes,m){const bps=2*m.G,ns=Math.ceil(bytes.length*8/bps),out=[];
 const bit=i=>(i>>3)<bytes.length?(bytes[i>>3]>>(7-(i&7)))&1:0;
 for(let s=0;s<ns;s++){const v=[];for(let g=0;g<m.G;g++){const k=2*(s*m.G+g);v.push(bit(k)*2+bit(k+1));}out.push(v);}return out;}
function symsToBytes(syms,m,nb){const out=new Array(nb).fill(0);let k=0;
 for(const v of syms)for(let g=0;g<m.G;g++){for(const bt of[v[g]>>1,v[g]&1]){if((k>>3)<nb&&bt)out[k>>3]|=1<<(7-(k&7));k++;}}return out;}
function chirp(sr){const n=Math.round(CH_LEN*sr),o=new Float32Array(n),tp=Math.round(0.005*sr);
 for(let i=0;i<n;i++){const t=i/sr;let a=1;if(i<tp)a=0.5-0.5*Math.cos(Math.PI*i/tp);else if(i>n-tp)a=0.5-0.5*Math.cos(Math.PI*(n-i)/tp);
  o[i]=a*Math.sin(2*Math.PI*(CH_F1*t+(CH_F2-CH_F1)*t*t/(2*CH_LEN)));}return o;}
function frameDuration(fr,modeId){const m=MODES[modeId];return LEAD+CH_LEN+GAP+HDR_SYMS*MODES[0].Ts+bytesToSyms(fr.payload,m).length*m.Ts+TAIL;}
function buildSignal(fr,modeId,sr){const m=MODES[modeId],hs=bytesToSyms(fr.hdr,MODES[0]),ps=bytesToSyms(fr.payload,m);
 const dur=frameDuration(fr,modeId),out=new Float32Array(Math.ceil(dur*sr));const d0=Math.round((LEAD+CH_LEN+GAP)*sr);
 const wr=(t0,mm,v,par)=>{const n0=Math.round(t0*sr),n=Math.round(mm.Ts*sr),rp=Math.round(0.001*sr);
  for(let g=0;g<mm.G;g++){const f=toneFreq(mm,g,par,v[g]),ph=((g*8+v[g]*2+par)*2.39996)%6.2832,w=2*Math.PI*f/sr;
   for(let i=0;i<n;i++){let a=1;if(i<rp)a=i/rp;else if(i>n-rp)a=(n-i)/rp;out[n0+i]+=a*Math.sin(w*(n0+i)+ph);}}};
 let t=LEAD+CH_LEN+GAP;hs.forEach((v,i)=>{wr(t,MODES[0],v,i&1);t+=MODES[0].Ts;});ps.forEach((v,i)=>{wr(t,m,v,i&1);t+=m.Ts;});
 let pk=0;for(let i=d0;i<out.length;i++)pk=Math.max(pk,Math.abs(out[i]));const sc=0.9/(pk||1);for(let i=d0;i<out.length;i++)out[i]*=sc;
 const c=chirp(sr),c0=Math.round(LEAD*sr);for(let i=0;i<c.length;i++)out[c0+i]=0.9*c[i];return out;}
// ---- FFT ----
function fft(re,im,inv){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]];}}
 for(let len=2;len<=n;len<<=1){const a=(inv?2:-2)*Math.PI/len,wr=Math.cos(a),wi=Math.sin(a);
  for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let j=0;j<len/2;j++){const k=i+j,l=k+len/2,tr=re[l]*cr-im[l]*ci,ti=re[l]*ci+im[l]*cr;
   re[l]=re[k]-tr;im[l]=im[k]-ti;re[k]+=tr;im[k]+=ti;const nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr;}}}
 if(inv)for(let i=0;i<n;i++){re[i]/=n;im[i]/=n;}}
function goertzel(b,s,n,f,sr){const c=2*Math.cos(2*Math.PI*f/sr);let s1=0,s2=0;for(let i=0;i<n;i++){const s0=b[s+i]+c*s1-s2;s2=s1;s1=s0;}return s1*s1+s2*s2-c*s1*s2;}
// ---- receiver ----
class Receiver{
 constructor(sr,cb){this.sr=sr;this.cb=cb;this.L=Math.round(CH_LEN*sr);this.N=sr>50000?32768:16384;
  const t=chirp(sr);this.tn=Math.sqrt(t.reduce((s,x)=>s+x*x,0));this.Tr=new Float64Array(this.N);this.Ti=new Float64Array(this.N);
  for(let i=0;i<this.L;i++)this.Tr[i]=t[this.L-1-i];fft(this.Tr,this.Ti,false);
  this.buf=new Float32Array(sr*30);this.base=0;this.len=0;this.state='search';this.sp=0;this.TH=0.22;this.hp=0;this.hx=0;}
 get end(){return this.base+this.len;}
 push(ch){const a=Math.exp(-2*Math.PI*400/this.sr);
  if(this.len+ch.length>this.buf.length){const keep=this.state==='search'?Math.max(this.sp,this.end-this.N)-this.base:0;
   if(keep>0){this.buf.copyWithin(0,keep,this.len);this.len-=keep;this.base+=keep;}
   if(this.len+ch.length>this.buf.length){const nb=new Float32Array((this.len+ch.length)*2);nb.set(this.buf.subarray(0,this.len));this.buf=nb;}}
  for(let i=0;i<ch.length;i++){const x=ch[i];this.hp=a*(this.hp+x-this.hx);this.hx=x;this.buf[this.len++]=this.hp;}
  this.process();}
 corr(s){const N=this.N,L=this.L,o=s-this.base,re=new Float64Array(N),im=new Float64Array(N);for(let i=0;i<N;i++)re[i]=this.buf[o+i];
  const E=new Float64Array(N+1);for(let i=0;i<N;i++)E[i+1]=E[i]+re[i]*re[i];
  fft(re,im,false);for(let i=0;i<N;i++){const a=re[i],b=im[i];re[i]=a*this.Tr[i]-b*this.Ti[i];im[i]=a*this.Ti[i]+b*this.Tr[i];}fft(re,im,true);
  const nc=j=>re[j+L-1]/(this.tn*Math.sqrt(E[j+L]-E[j])+1e-9);
  for(let j=0;j<=N-2*L;j++){if(nc(j)>this.TH){let bj=j,bv=nc(j);for(let k=j+1;k<j+L;k++){const v=nc(k);if(v>bv){bv=v;bj=k;}}return{p:s+bj,q:bv};}}
  return null;}
 demod(abs,m,par){const s=abs-this.base+Math.round(m.off*this.sr),n=Math.round(m.W*this.sr),v=[];let cs=0;
  for(let g=0;g<m.G;g++){let bt=0,bp=-1,sm=0;for(let t=0;t<4;t++){const p=goertzel(this.buf,s,n,toneFreq(m,g,par,t),this.sr);sm+=p;if(p>bp){bp=p;bt=t;}}v.push(bt);cs+=bp/(sm+1e-12);}
  return{v,c:cs/m.G};}
 symStart(i,m,t0){return t0+Math.round(i*m.Ts*this.sr);}
 process(){const sr=this.sr;
  for(;;){
   if(this.state==='search'){if(this.end-this.sp<this.N)return;const r=this.corr(this.sp);
    if(!r){this.sp+=this.N-2*this.L;continue;}
    this.p=r.p;this.q=r.q;this.h0=r.p+Math.round((CH_LEN+GAP)*sr);this.state='hdr';this.cb({type:'sync',q:r.q});}
   if(this.state==='hdr'){const m=MODES[0],need=this.symStart(HDR_SYMS,m,this.h0)+Math.round(0.015*sr);if(this.end<need)return;
    let best=null;for(let d=-12;d<=12;d++){const sh=Math.round(d*0.001*sr),sy=[];let cc=0;
     for(let i=0;i<HDR_SYMS;i++){const r=this.demod(this.symStart(i,m,this.h0)+sh,m,i&1);sy.push(r.v);cc+=r.c;}
     const h=parseHeader(symsToBytes(sy,m,8));if(h){const sc=h.errs-cc;if(!best||sc<best.sc)best={h,sh,sc};}}
    if(!best){this.cb({type:'hdrfail',q:this.q});this.state='search';this.sp=this.p+Math.round(0.02*sr);continue;}
    const h=best.h;this.h=h;this.sh0=this.sh=best.sh;this.pm=MODES[h.mode];this.cl=codedLen(h.len);this.ns=Math.ceil(this.cl*8/(2*this.pm.G));this.p0=this.symStart(HDR_SYMS,m,this.h0);
    this.syms=[];this.state='pay';this.cb({type:'hdr',h,ns:this.ns,q:this.q,off:best.sh/sr*1000});}
   if(this.state==='pay'){const m=this.pm;
    const dl=Math.max(1,Math.round(0.0005*sr)),lim=Math.round(0.004*sr);
    while(this.syms.length<this.ns){const i=this.syms.length,st=this.symStart(i,m,this.p0);if(st+this.sh+lim+Math.round(m.Ts*sr)>this.end)break;
     let b=null;for(const d of[-dl,0,dl]){const o=this.sh+d;if(Math.abs(o-this.sh0)>lim)continue;const r=this.demod(st+o,m,i&1);if(!b||r.c>b.c+(d?0.04:0))b={...r,o};}
     this.sh=b.o;this.syms.push(b.v);}
    this.cb({type:'prog',f:this.syms.length/this.ns});if(this.syms.length<this.ns)return;
    const r=decodePayload(symsToBytes(this.syms,m,this.cl),this.h.len);
    this.cb(r?{type:'msg',bytes:r.bytes,enc:this.h.enc,errs:r.errs+this.h.errs,mode:this.h.mode,q:this.q,len:this.h.len}:{type:'payfail',mode:this.h.mode,q:this.q});
    this.sp=this.symStart(this.ns,m,this.p0)+this.sh;this.state='search';}
  }}
}

const $=id=>document.getElementById(id);let modeId=1,ctx=null;
const setSess=t=>{try{if(navigator.audioSession)navigator.audioSession.type=t;}catch(e){}};
function getCtx(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state!=='running')ctx.resume();return ctx;}
$('tS').onclick=()=>{$('tS').classList.add('on');$('tR').classList.remove('on');$('pS').hidden=false;$('pR').hidden=true;};
$('tR').onclick=()=>{$('tR').classList.add('on');$('tS').classList.remove('on');$('pR').hidden=false;$('pS').hidden=true;};
const RATE=m=>Math.round(2*m.G/m.Ts*0.77);
MODES.forEach(m=>{const b=document.createElement('button');b.innerHTML=m.name+'<span>~'+RATE(m)+' бит/с</span>';b.onclick=()=>{modeId=m.id;[...$('mode').children].forEach((x,i)=>x.classList.toggle('on',i===m.id));upd();};$('mode').appendChild(b);});
$('mode').children[modeId].classList.add('on');
try{const s=localStorage.getItem('echo_mode');if(s!==null){modeId=+s;[...$('mode').children].forEach((x,i)=>x.classList.toggle('on',i===modeId));}}catch(e){}
let updT;async function upd(){try{localStorage.setItem('echo_mode',modeId)}catch(e){}clearTimeout(updT);updT=setTimeout(async()=>{const s=$('txt').value;if(!s){$('info').textContent='—';return;}
 const e=await encodeText(s);const fr=makeFrame(e.bytes,e.enc,modeId);$('info').textContent=`${[...s].length} симв. → ${e.bytes.length} байт${e.enc&2?' (сжато)':''} · ≈ ${frameDuration(fr,modeId).toFixed(1)} с`;},150);}
$('txt').oninput=upd;
let src=null,raf=0;
$('send').onclick=async()=>{if(src){src.stop();return;}const s=$('txt').value;if(!s)return;stopListen();setSess('playback');
 const c=getCtx(),e=await encodeText(s);if(e.bytes.length>60000){alert('Слишком длинно');return;}
 const fr=makeFrame(e.bytes,e.enc,modeId),sig=buildSignal(fr,modeId,c.sampleRate),buf=c.createBuffer(1,sig.length,c.sampleRate);buf.getChannelData(0).set(sig);
 src=c.createBufferSource();src.buffer=buf;src.connect(c.destination);const t0=c.currentTime,d=buf.duration;src.start();
 $('send').textContent='Стоп';$('send').classList.add('stop');
 const tick=()=>{$('tp').style.width=Math.min(100,(c.currentTime-t0)/d*100)+'%';raf=requestAnimationFrame(tick);};tick();
 src.onended=()=>{cancelAnimationFrame(raf);src=null;$('send').textContent='Передать';$('send').classList.remove('stop');$('tp').style.width='0';};};
// ---- receive ----
let stream=null,proc=null,an=null,R=null,wfRaf=0,ring=null,rpos=0,rfull=false;
const st=(t,c)=>{$('status').textContent=t;$('status').style.color=c||'';};
async function startListen(){setSess('play-and-record');const c=getCtx();
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});}
 catch(e){st('Нет доступа к микрофону: '+e.message,'var(--warn)');return;}
 const s=c.createMediaStreamSource(stream);proc=c.createScriptProcessor(4096,1,1);an=c.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=0;
 const z=c.createGain();z.gain.value=0;s.connect(proc);s.connect(an);proc.connect(z);z.connect(c.destination);
 R=new Receiver(c.sampleRate,onEv);ring=new Float32Array(c.sampleRate*20);rpos=0;rfull=false;proc.onaudioprocess=ev=>{try{const x=new Float32Array(ev.inputBuffer.getChannelData(0));for(let i=0;i<x.length;i++){ring[rpos++]=x[i];if(rpos>=ring.length){rpos=0;rfull=true;}}R.push(x);}catch(err){st('Ошибка: '+err.message,'var(--warn)');}};
 $('listen').textContent='Стоп';$('listen').classList.add('stop');st('Слушаю эфир…');drawWF();}
function stopListen(){if(!stream)return;stream.getTracks().forEach(t=>t.stop());proc&&proc.disconnect();stream=null;proc=null;cancelAnimationFrame(wfRaf);
 $('listen').textContent='Слушать';$('listen').classList.remove('stop');st('Остановлено');$('rp').style.width='0';}
$('rec').onclick=async()=>{if(!ring){alert('Сначала нажмите «Слушать» и проиграйте передачу');return;}
 const sr=ctx.sampleRate,a=rfull?[...ring.subarray(rpos),...ring.subarray(0,rpos)]:Array.from(ring.subarray(0,rpos)),n=a.length,b=new DataView(new ArrayBuffer(44+n*2));
 const ws=(o,s)=>{for(let i=0;i<s.length;i++)b.setUint8(o+i,s.charCodeAt(i));};ws(0,'RIFF');b.setUint32(4,36+n*2,true);ws(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);
 b.setUint32(24,sr,true);b.setUint32(28,sr*2,true);b.setUint16(32,2,true);b.setUint16(34,16,true);ws(36,'data');b.setUint32(40,n*2,true);
 for(let i=0;i<n;i++)b.setInt16(44+i*2,Math.max(-1,Math.min(1,a[i]))*32767,true);
 const f=new File([b.buffer],'exo_'+Date.now()+'.wav',{type:'audio/wav'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});}catch(e){}}else{const l=document.createElement('a');l.href=URL.createObjectURL(f);l.download=f.name;l.click();}};
$('listen').onclick=()=>stream?stopListen():startListen();
function onEv(e){
 if(e.type==='sync'){st('Сигнал пойман…','var(--acc)');$('dbg').textContent=`синхр. q=${e.q.toFixed(2)}`;}
 else if(e.type==='hdr'){st(`Приём: ${MODES[e.h.mode].name}, ${e.h.len-2} байт`,'var(--acc)');$('dbg').textContent=`синхр. q=${e.q.toFixed(2)} · сдвиг ${e.off.toFixed(0)} мс · ош. заголовка ${e.h.errs}`;}
 else if(e.type==='prog')$('rp').style.width=(e.f*100)+'%';
 else if(e.type==='hdrfail'){st('Заголовок не прочитан — ищу дальше…','var(--warn)');$('dbg').textContent=`синхр. q=${e.q.toFixed(2)} · заголовок: ни один сдвиг не подошёл`;}
 else if(e.type==='payfail'){addMsg(null,'Сообщение повреждено — попросите повторить или выберите режим надёжнее',e);st('Слушаю эфир…');$('rp').style.width='0';}
 else if(e.type==='msg'){decodeText(e.bytes,e.enc).then(t=>addMsg(t,null,e)).catch(()=>addMsg(null,'Ошибка распаковки',e));st('Слушаю эфир…');$('rp').style.width='0';if(navigator.vibrate)navigator.vibrate(80);}}
function addMsg(t,err,e){const d=document.createElement('div');d.className='msg'+(err?' fail':'');d.textContent=t??err;
 const m=document.createElement('div');m.className='meta';const tm=new Date().toLocaleTimeString('ru-RU');
 m.innerHTML=`<span>${tm} · ${MODES[e.mode].name}${t!=null?' · исправлено '+e.errs+' ош.':''}</span>`;
 if(t!=null){const b=document.createElement('button');b.textContent='Копировать';b.onclick=()=>{navigator.clipboard.writeText(t);b.textContent='✓';};m.appendChild(b);}
 d.appendChild(m);$('log').prepend(d);}
function drawWF(){const cv=$('wf'),g=cv.getContext('2d'),W=cv.width,H=cv.height,d=new Uint8Array(an.frequencyBinCount),sr=ctx.sampleRate,hz=sr/an.fftSize;
 const step=()=>{an.getByteFrequencyData(d);g.drawImage(cv,-2,0);for(let y=0;y<H;y++){const f=500+(H-1-y)/H*10500,v=d[Math.round(f/hz)]||0;g.fillStyle=`hsl(${160-v*0.6},90%,${v/2.8}%)`;g.fillRect(W-2,y,2,1);}wfRaf=requestAnimationFrame(step);};step();}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&src)src.stop();});
</script></body></html>
